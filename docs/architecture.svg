<text x="2000" y="200" font-size="18" font-weight="600" fill="#5C2D91" text-anchor="middle">Managed devices</text>
<text x="2000" y="231" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Defender-onboarded endpoints</text>
<text x="2000" y="252" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle"></text>
<text x="2000" y="273" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">AI tools outside the agent platforms:</text>
<text x="2000" y="294" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Claude Code, Copilot CLI,</text>
<text x="2000" y="315" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Ollama and Cursor</text>
<line x1="2000" y1="350" x2="2000" y2="400" stroke="#0078D4" stroke-width="2" marker-end="url(#h0078D4)"/>
<rect x="1808" y="406" width="384" height="190" rx="10" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="2000" y="440" font-size="18" font-weight="600" fill="#0078D4" text-anchor="middle">Defender advanced hunting</text>
<text x="2000" y="471" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Web.Contents → advancedqueries</text>
<text x="2000" y="492" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle"></text>
<text x="2000" y="513" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Security Reader, or any</text>
<text x="2000" y="534" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">advanced hunting role</text>
<line x1="2000" y1="600" x2="2000" y2="858" stroke="#107C10" stroke-width="2" marker-end="url(#h107C10)"/>
<rect x="32" y="862" width="2160" height="128" rx="10" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text x="1112" y="896" font-size="18" font-weight="600" fill="#107C10" text-anchor="middle">POWER BI SEMANTIC MODEL</text>
<text x="1112" y="927" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">20 tables · 137 measures · Import · risk score derived in M</text>
<text x="1112" y="948" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Connects to Azure Resource Graph, Dataverse and Defender advanced hunting</text>
<text x="1112" y="969" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Scheduled refresh in PowerBI.com — no gateway, no local files</text>
<line x1="1112" y1="994" x2="1112" y2="1046" stroke="#0c8599" stroke-width="2" marker-end="url(#h0c8599)"/>
<rect x="32" y="1052" width="2160" height="128" rx="10" fill="#99e9f2" stroke="#0c8599" stroke-width="2"/>
<text x="1112" y="1086" font-size="18" font-weight="600" fill="#0c8599" text-anchor="middle">REPORT · 11 pages · 174 visuals</text>
<text x="1112" y="1117" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Overview · Agents · Estate · Agents · Builders · Agents · Tools &amp; knowledge · Agents · SharePoint</text>
<text x="1112" y="1138" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Risk · Agents to review · Risk · Knowledge reach · Risk · Shadow AI · Setup &amp; coverage</text>
<text x="1112" y="1159" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">Drill-through: All agents · Knowledge &amp; grounding</text>
<rect x="32" y="1206" width="2160" height="216" rx="10" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text x="1112" y="1240" font-size="18" font-weight="600" fill="#495057" text-anchor="middle">HOW EACH LANE REACHES THE MODEL — AND WHY D AND E COLLECT OUT OF BAND</text>
<text x="1112" y="1271" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Lane D — named knowledge lives in each environment; application users collect it into one tenant-wide Dataverse table.</text>
<text x="1112" y="1297" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Lane E — SharePointAgentLogging reconstructs observed .agent inventory from sharePointFileOperation audit records.</text>
<text x="1112" y="1323" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Power BI reads those two landing-table lanes from Dataverse; it never calls their POST-only or tenant-fan-out collection paths.</text>
<text x="1112" y="1349" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Lane F — Defender advanced hunting uses one fixed host, so Power BI queries it directly at refresh time and fails soft when unavailable.</text>
<text x="1112" y="1375" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Usage, value and cost (Copilot Chat, Cowork, per-agent conversations, credits) live in Analytics Hub, not here.</text>
<text x="1112" y="1401" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">Both PBIP builds contain the same pages and tables: pbip-cloud reads live services; pbip reads equivalent CSV shapes, including DimSharePointAgent.</text>
</svg>
