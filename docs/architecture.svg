<text x="1556" y="471" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">AuditLogsQuery.Read.All</text>
<text x="1556" y="492" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">No Sites.Read.All</text>
