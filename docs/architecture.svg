<text x="1556" y="231" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">SharePoint file operations</text>
<text x="1556" y="252" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle"></text>
<text x="1556" y="273" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">.agent create, update, delete, recycle</text>
<text x="1556" y="294" font-size="15" font-weight="400" fill="#1b1b1b" text-anchor="middle">ListItemUniqueId is the stable key</text>
<line x1="1556" y1="350" x2="1556" y2="400" stroke="#F7630C" stroke-width="2" marker-end="url(#hF7630C)"/>
<rect x="1364" y="406" width="384" height="190" rx="10" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
